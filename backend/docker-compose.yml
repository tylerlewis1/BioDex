services:
  db:
    image: postgres:latest
    container_name: biodexDB
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

#setting up docker with experss server
  api:
    build: ./api
    container_name: biodexAPI
    restart: always
    ports:
      - "${API_PORT}:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=biodexDB
    depends_on: 
      - db

volumes:
  postgres_data: